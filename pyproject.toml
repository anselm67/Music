[project]
name = "music"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.5",
    "beautifulsoup4>=4.14.3",
    "click>=8.4.0",
    "lightning>=2.6.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "scipy>=1.17.1",
    "torch",
    "torchinfo>=1.8.0",
    "torchvision",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/kern", "src/midi", "src/noter", "src/pdmx", "src/scorer", "src/staffer", "src/utils", "src/verovio"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.0.260204",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "types-aiofiles>=25.1.0.20260518",
    "types-tqdm>=4.67.3.20260518",
]

[tool.ruff]
line-length = 88  # or whatever you use now

[tool.ruff.lint]
select = ["E", "F"]   # pycodestyle errors + pyflakes — safe baseline
ignore = []

[tool.ruff.format]
# ruff format is black-compatible by default; no config needed to start

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
kern = "cli.kern:main"
pdmx = "cli.pdmx:main"
staffer = "cli.staffer:main"
noter = "cli.noter:main"
scorer = "cli.scorer:main"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "torchvision.*",
    "torch.*",
    "scipy.*",
]
ignore_missing_imports = true
